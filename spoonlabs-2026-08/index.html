<script>
  var SALT="2rbkPrRpvZhQgYOB0iDCuQ==", IV="9xdqo7jgQJqEO1h3", ITER=310000;
  var b=function(s){var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;};
  var pw=document.getElementById("pw"), btn=document.getElementById("btn"), m=document.getElementById("m");
  async function unlock(){
    var p=pw.value; if(!p){pw.focus();return;}
    btn.disabled=true; m.className="m wait"; m.textContent="확인 중...";
    try{
      var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveKey"]);
      var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(SALT),iterations:ITER,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
      var data=b(document.getElementById("payload").textContent.trim());
      var plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(IV)},key,data);
      var html=new TextDecoder().decode(plain);
      document.open(); document.write(html); document.close();
    }catch(e){
      m.className="m err"; m.textContent="비밀번호가 올바르지 않습니다.";
      btn.disabled=false; pw.select();
    }
  }
  btn.addEventListener("click",unlock);
  pw.addEventListener("keydown",function(e){ if(e.key==="Enter") unlock(); });
